name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Адрес и публичный (anon) ключ Supabase берутся из секретов репозитория
      # (Settings → Secrets and variables → Actions), в коде их нет.
      - run: npm run build
        env:
          # копия на perizat0396.github.io/ai-ustaz/ открывается из подпапки
          BASE_PATH: /ai-ustaz/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SPA-фолбэк: любой глубокий URL (/ai-ustaz/generate) GitHub Pages
      # отдаёт как 404 -> подсовываем ему index.html, дальше роутер сам разберётся.
      - run: cp dist/index.html dist/404.html

      # Отключаем Jekyll, чтобы файлы/папки с "_" не выкидывались.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
